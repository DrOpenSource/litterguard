name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle and validates the wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Current AndroidX needs compileSdk 37.2 (see docs/memory/LEARNINGS.md [build]).
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - name: Full quality gate
        run: ./gradlew spotlessCheck detekt test lintDebug assembleDebug -PwarningsAsErrors=true --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: "**/build/reports/**"
          retention-days: 14
